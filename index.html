<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ember.js</title>
  </head>
  <body>
    <script type="module">
      // GXT builds: the gxt compiler lowers decorators in .gjs/.gts to the
      // `dt7948` global. `__GXT_MODE__` is inlined per build by replaceBuildConstant.
      import * as _dt from 'decorator-transforms/runtime';
      if (__GXT_MODE__) {
        globalThis.dt7948 = _dt;
      }
    </script>
    <script type="module">
      // By package name, as in the tests. The dev server then gives this page
      // and the tests the same copy of QUnit.
      import 'qunit';
      import 'qunit/qunit/qunit.css';

      // The last script of this page starts QUnit, after all tests are loaded.
      QUnit.config.autostart = false;

      window.EmberENV = {};

      // In GXT mode, use synchronous observers to match standard Ember behavior.
      // Tests expect observers to fire synchronously during notifyPropertyChange.
      // Classic keeps upstream's async default (`true`) — flipping it changes
      // observer/CP timing and fails the classic observer suites. The bare
      // flag is inlined per build by replaceBuildConstant.
      EmberENV._DEFAULT_ASYNC_OBSERVERS = !__GXT_MODE__;

      // Handle testing feature flags
      if (QUnit.urlParams.ENABLE_OPTIONAL_FEATURES) {
        EmberENV.ENABLE_OPTIONAL_FEATURES = true;
      }

      EmberENV['RAISE_ON_DEPRECATION'] = QUnit.urlParams.RAISE_ON_DEPRECATION
        ? QUnit.urlParams.RAISE_ON_DEPRECATION === 'true'
        : true;

      if (QUnit.urlParams.ALL_DEPRECATIONS_ENABLED) {
        EmberENV['_ALL_DEPRECATIONS_ENABLED'] = true;
      }

      if (QUnit.urlParams.OVERRIDE_DEPRECATION_VERSION) {
        EmberENV['_OVERRIDE_DEPRECATION_VERSION'] = QUnit.urlParams.OVERRIDE_DEPRECATION_VERSION;
      }

      QUnit.config.urlConfig.push({
        id: 'OVERRIDE_DEPRECATION_VERSION',
        value: ['20.0.0', '8.0.0', '7.12.0', '6.0.0', '5.12.0'],
        label: 'Deprecation Version',
      });

      QUnit.config.urlConfig.push({
        id: 'skip_tests_with_target_blank',
        label: 'Skip tests w/ target _blank',
      });

      if (__GXT_MODE__) {
        // GXT test-harness setup. None of it runs in the classic build.

        // Per-test timeout: some GXT rendering operations can loop in
        // backburner, and a hung test would otherwise stall the whole run.
        QUnit.config.testTimeout = 10000;

        // Loop guard: renderer.ts and metal/property_events.ts call
        // `__gxtOpCheck()` (GXT + DEBUG only); it throws once a test exceeds
        // the operation budget, breaking an infinite synchronous loop.
        globalThis.__gxtOpCount = 0;
        globalThis.__gxtOpLimit = 500000;
        globalThis.__gxtOpCheck = function () {
          if (++globalThis.__gxtOpCount > globalThis.__gxtOpLimit) {
            globalThis.__gxtOpCount = 0;
            throw new Error('[GXT] Operation limit exceeded - breaking infinite loop');
          }
        };

        // Skip the nested each-body proxy wrap for self-reactive wrapper
        // instances (e.g. RFC#1071 cells) whose reads entangle their own native
        // reactivity. Only this test page sets the flag; see
        // `_isSelfReactiveWrapper` in compile.ts.
        if (typeof globalThis.__gxtR6SkipSelfReactive === 'undefined') {
          globalThis.__gxtR6SkipSelfReactive = true;
        }

        QUnit.testStart(function () {
          // Each test gets a fresh operation budget.
          globalThis.__gxtOpCount = 0;
        });

        QUnit.testDone(function () {
          globalThis.__gxtOpCount = 0;
          // Periodically force GC when the harness exposes it (the GXT test
          // runner launches Chromium with --js-flags=--expose-gc). The
          // cumulative single-page run accumulates renderer GC debt across ~10k
          // tests; without this the realm eventually fails allocations outright
          // (RangeError: Array buffer allocation failed).
          globalThis.__gxtTestDoneCount = (globalThis.__gxtTestDoneCount || 0) + 1;
          if (typeof window.gc === 'function' && globalThis.__gxtTestDoneCount % 50 === 0) {
            window.gc();
          }
        });
      }
    </script>

    <script type="module">
      // GXT builds: registers the gxt runtime template compiler before any
      // template module loads. Classic builds resolve it to an empty module (see
      // the gxtTestSetup plugin in vite.config.mjs).
      import 'virtual:gxt-test-setup';

      import setupQUnit from './packages/internal-test-helpers/lib/ember-dev/setup-qunit.ts';
      import setupTestHelpers from './packages/internal-test-helpers/lib/ember-dev/setup-test-helpers.js';
      import { setTesting } from './packages/@ember/debug/index.ts';
      setupQUnit();
      setupTestHelpers();
      setTesting(true);
    </script>

    <script type="module">
      // tests in internal packages
      import.meta.glob('./packages/@ember/-internals/*/tests/**/*.{js,ts,gjs,gts}', {
        eager: true,
      });

      // tests in scoped packages
      import.meta.glob('./packages/*/*/tests/**/*.{js,ts,gjs,gts}', {
        eager: true,
      });

      // tests in non-scoped packages
      import.meta.glob('./packages/*/tests/**/*.{js,ts,gjs,gts}', {
        eager: true,
      });

      // packages originally authored in glimmer-vm repo have a different test
      // naming convention
      import.meta.glob(
        './packages/{@glimmer,@glimmer-workspace}/*/test/**/*-test.{js,ts,gjs,gts}',
        {
          eager: true,
        }
      );

      // GXT builds: gxt-backend's own tests (an empty module in classic builds).
      import 'virtual:gxt-tests';

      // ember-qunit calls the testem hook when a test imports it, and that call
      // throws if testem is already hooked. So testem loads after the tests.
      let testem = document.createElement('script');
      testem.src = '/testem.js';
      testem.onload = testem.onerror = () => QUnit.start();
      document.body.append(testem);
    </script>

    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
  </body>
</html>
