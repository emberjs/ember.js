name: API Docs Preview

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  build:
    name: Build API docs preview
    if: >-
      contains(github.event.pull_request.labels.*.name, 'api-docs-preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'api-docs-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: api-docs-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout ember.js
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ember.js
          persist-credentials: false

      - name: Checkout ember-jsonapi-docs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kategengler/ember-jsonapi-docs
          path: ember-jsonapi-docs
          persist-credentials: false

      - name: Checkout ember-api-docs-data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ember-learn/ember-api-docs-data
          path: ember-api-docs-data
          persist-credentials: false
          # Only the scripts at the root. The preview shows the docs of the PR and no released version.
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false

      - name: Checkout ember-api-docs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ember-learn/ember-api-docs
          path: ember-api-docs
          persist-credentials: false

      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        name: Install pnpm
        with:
          cache: false
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies for ember-jsonapi-docs
        run: pnpm install
        working-directory: ember-jsonapi-docs

      - name: Install dependencies for ember-api-docs-data
        run: npm install
        working-directory: ember-api-docs-data

      - name: Install dependencies for ember-api-docs
        run: pnpm install
        working-directory: ember-api-docs

      - name: Get Ember version from package.json
        id: pkg
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
        working-directory: ember.js

      - name: Generate API docs
        run: pnpm run gen --project ember --version "${STEPS_PKG_OUTPUTS_VERSION}"
        working-directory: ember-jsonapi-docs
        env:
          STEPS_PKG_OUTPUTS_VERSION: ${{ steps.pkg.outputs.version }}

      - name: Fix docs
        run: npm run fix:files
        working-directory: ember-api-docs-data

      - name: Build ember-api-docs
        run: |
          ln -s ../ember-api-docs-data ember-api-docs-data
          pnpm exec ember build --environment=production
          # A static server sends 404.html for a path that is not a file. The app then shows the route.
          cp dist/index.html dist/404.html
        working-directory: ember-api-docs

      - name: Upload preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs-preview
          path: ember-api-docs/dist
          if-no-files-found: error
