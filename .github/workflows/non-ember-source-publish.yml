# For every push to the primary branch with .release-plan.json modified,
# runs release-plan.

name: Publish Stable (non-ember-source)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".release-plan.json"

permissions:
  contents: read
  
concurrency:
  group: publish-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: "NPM Publish"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: deploy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          use-node-modules-cache: false # Absolutely no cache should be used when publishing due to the potential of cache-poisoning.
          use-lockfile: true
      - run: pnpm build
      - name: Publish to NPM
        run: NPM_CONFIG_PROVENANCE=true pnpm release-plan publish
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
  notify-failure:
    name: Notify Discord of Release Failure
    runs-on: ubuntu-latest
    needs: [publish]
    if: failure()
    steps:
      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ secrets.FRAMEWORK_WEBHOOK }}
          status: "Failure"
          title: "Failed to release-plan publish in ember.js ${{ github.ref_name }}"
          color: 0xcc0000
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          username: GitHub Actions
  notify-success:
    name: Notify Discord of Release Success
    runs-on: ubuntu-latest
    needs: [publish]
    if: success()
    steps:
      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ secrets.FRAMEWORK_WEBHOOK }}
          status: "Success"
          title: "Release-plan succeeded in ember.js ${{ github.ref_name }}"
          color: 0x2ecc71
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          username: GitHub Actions
