name: Alpha Releases

on:
  schedule:
    - cron: "0 20 * * 3" # weekly (Wednesday)
  workflow_dispatch:

permissions:
  contents: read # PAT used for push

jobs:
  tests:
    uses: ./.github/workflows/ci-jobs.yml

  release:
    name: Tag + Push
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: setup git
        run: |
          git config --local user.email 'tomster@emberjs.com'
          git config --local user.name 'Ember.js Alpha Releaser'
      - name: Find next alpha
        run: |
          LATEST_ALPHA=`npm view ember-source dist-tags.alpha`
          export NEXT_ALPHA=`node bin/next-alpha-version.cjs ${LATEST_ALPHA}`
          echo "NEXT_ALPHA=$NEXT_ALPHA" >> $GITHUB_ENV
      - name: bump version
        run: npm version ${NEXT_ALPHA} --allow-same-version --no-git-tag-version
      - name: create tag
        run: git tag v${NEXT_ALPHA}-ember-source
      - name: push tag
        # Push in a way that WILL trigger other workflows
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          credential_helper='!f() { echo "username=$GITHUB_ACTOR"; echo "password=$PERSONAL_TOKEN"; }; f'
          git -c credential.helper= -c credential.helper="$credential_helper" push "https://github.com/${GITHUB_REPOSITORY}" "v${NEXT_ALPHA}-ember-source"
