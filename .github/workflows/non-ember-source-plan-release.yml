name: Plan Release (non-ember-source)
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request_target: # This workflow has permissions on the repo, do NOT run code from PRs in this workflow. See https://securitylab.github.com/research/github-actions-preventing-pwn-requests/ # zizmor: ignore[dangerous-triggers] we know what we are doing here
    types:
      - labeled
      - unlabeled

concurrency:
  group: plan-release # only the latest one of these should ever be running
  cancel-in-progress: true

jobs:
  should-run-release-plan-prepare:
    name: Should we run release-plan prepare?
    runs-on: ubuntu-latest
    outputs:
      should-prepare: ${{ steps.should-prepare.outputs.should-prepare }}
    permissions:
      contents: read

    steps:
      - uses: release-plan/actions/should-prepare-release@ed561973c19bde2b2715c2f69c0d764724ad4616 # v1.1.1
        with:
          ref: "main"
        id: should-prepare

  create-prepare-release-pr:
    name: Create Prepare Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: should-run-release-plan-prepare
    permissions:
      contents: write
      issues: read
      pull-requests: write
    if: needs.should-run-release-plan-prepare.outputs.should-prepare == 'true'
    steps:
      # release-plan/actions/prepare always installs the unscoped
      # release-plan package, so these steps run the
      # @nullvoxpopuli/release-plan copy that pnpm installs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # release-plan reads git history since the last release of each package
          fetch-depth: 0
          ref: "main"
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Run release-plan prepare
        id: explanation
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          pnpm release-plan prepare 2> >(tee -a release-plan-stderr.txt >&2)

          if [ $? -ne 0 ]; then
            release_plan_output=$(cat release-plan-stderr.txt)
            echo "::error::Failed to run release-plan prepare $release_plan_output"
          else
            release_plan_output=$(jq .description .release-plan.json -r)
            if [ $(jq '.solution | length' .release-plan.json) -eq 1 ]; then
              echo "new_version=v$(jq -r '.solution[].newVersion' .release-plan.json)" >> $GITHUB_OUTPUT
            fi
          fi
          rm -f release-plan-stderr.txt

          echo 'text<<EOF' >> $GITHUB_OUTPUT
          echo "$release_plan_output" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        name: Create Prepare Release PR
        with:
          commit-message: "Prepare Release ${{ steps.explanation.outputs.new_version }} using 'release-plan'"
          labels: "internal"
          sign-commits: true
          branch: release-preview
          title: Prepare Release ${{ steps.explanation.outputs.new_version }}
          body: |
            This PR is a preview of the release that [release-plan](https://github.com/embroider-build/release-plan) has prepared. To release you should just merge this PR 👍

            -----------------------------------------

            ${{ steps.explanation.outputs.text }}
